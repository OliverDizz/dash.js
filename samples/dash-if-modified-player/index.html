<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="https://dashif.org/img/favicon.ico" />
    <title>DASH-IF Reference Client - Dual Stream</title>

    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../contrib/controlbar/controlbar.css" rel="stylesheet">
    <link href="app/css/main.css" rel="stylesheet">

    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <script src="../../dist/modern/umd/dash.mss.debug.js"></script>

    <script src="vendor/chart.js/chart.umd.js"></script>

    <style>
        /* Custom styles to ensure the dual layout fits well on standard screens */
        .split-container {
            display: flex;
            width: 100%;
            gap: 15px;
            padding: 0 15px;
        }

        .player-instance {
            flex: 1;
            min-width: 0;
            border: 1px solid var(--bs-border-color);
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="main-container">

        <div class="header-bar">
            <div class="logo-area">
                <img src="img/if.png" alt="DASH-IF">
                <h1>Reference Client</h1>
            </div>
            <div class="github-links">
                <select class="theme-select" id="theme-select" aria-label="Theme">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
        </div>

        <div class="px-3 mb-3 d-flex gap-2 align-items-center">
            <button class="btn btn-primary" id="btn-global-load"
                title="Loads both players simultaneously so chart metrics align">
                <i class="bi bi-cloud-download"></i> Load Both
            </button>
            <button class="btn btn-success" id="btn-global-play">
                <i class="bi bi-play-fill"></i> Play Both
            </button>
            <button class="btn btn-warning" id="btn-global-pause">
                <i class="bi bi-pause-fill"></i> Pause Both
            </button>
            <div class="form-check ms-3" title="Warning: This can mask buffering stalls during ABR testing">
                <input class="form-check-input" type="checkbox" id="chk-sync-playback">
                <label class="form-check-label" for="chk-sync-playback">Lock Playback Times (Master/Slave)</label>
            </div>
        </div>

        <div class="split-container" id="dual-players-container">
        </div>

        <div class="chart-panel mt-4 px-3" id="chart-panel">
            <div class="chart-panel-header">
                <h6><i class="bi bi-graph-up"></i> Comparative Metrics Chart</h6>
                <div>
                    <button class="btn btn-sm btn-outline-secondary" id="btn-chart-clear" title="Clear chart data">
                        <i class="bi bi-trash"></i> Clear
                    </button>
                    <button class="btn btn-sm btn-outline-secondary ms-1" id="btn-chart-toggle"
                        title="Enable/Disable chart">
                        <i class="bi bi-eye"></i> Enabled
                    </button>
                </div>
            </div>
            <div class="chart-canvas-wrapper" id="chart-wrapper">
                <canvas id="metrics-chart"></canvas>
            </div>
        </div>
    </div>

    <template id="player-ui-template">
        <div class="player-instance">
            <h4 class="instance-title text-primary mb-3">Stream Title</h4>

            <div class="url-bar mb-3">
                <div class="input-group">
                    <input type="text" class="form-control stream-url" placeholder="Enter MPD URL...">
                    <button class="btn btn-outline-secondary btn-options" type="button"><i class="bi bi-gear"></i>
                        Options</button>
                    <button class="btn btn-success btn-load" type="button"><i class="bi bi-play-fill"></i> Load</button>
                </div>
            </div>

            <div class="options-panel collapsed mb-3">
                <div class="options-scroll-wrapper" style="max-height: 250px; overflow-y: auto;">
                    <div class="options-scroll">

                        <div class="option-card">
                            <div class="option-card-header">Playback</div>
                            <div class="option-card-body">
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-autoplay" checked><label class="form-check-label"
                                        for="opt-autoplay">Auto Play</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox" id="opt-loop"
                                        checked><label class="form-check-label" for="opt-loop">Loop</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-muted"><label class="form-check-label" for="opt-muted">Muted</label>
                                </div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-schedule-while-paused"><label class="form-check-label"
                                        for="opt-schedule-while-paused">Schedule While Paused</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-calc-seg-avail"><label class="form-check-label"
                                        for="opt-calc-seg-avail">Calc Seg Avail From Timeline</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-reuse-sourcebuffers"><label class="form-check-label"
                                        for="opt-reuse-sourcebuffers">Reuse Existing SourceBuffers</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-mediasource-duration-inf"><label class="form-check-label"
                                        for="opt-mediasource-duration-inf">MediaSource Duration Inf</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-reset-sb-track-switch"><label class="form-check-label"
                                        for="opt-reset-sb-track-switch">Reset SB on Incompat Track</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-save-last-media"><label class="form-check-label"
                                        for="opt-save-last-media">Save Last Media Settings</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-local-storage"><label class="form-check-label"
                                        for="opt-local-storage">Allow Local Storage</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-jump-gaps"><label class="form-check-label" for="opt-jump-gaps">Jump
                                        Small Gaps</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-content-steering"><label class="form-check-label"
                                        for="opt-content-steering">Apply Content Steering</label></div>
                            </div>
                        </div>

                        <div class="option-card">
                            <div class="option-card-header">ABR</div>
                            <div class="option-card-body">
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-fast-switch"><label class="form-check-label" for="opt-fast-switch">Fast
                                        Switching</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-auto-switch-video"><label class="form-check-label"
                                        for="opt-auto-switch-video">Video Auto Switch</label></div>
                                <div class="option-section">ABR Rules</div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-rule-throughput"><label class="form-check-label"
                                        for="opt-rule-throughput">ThroughputRule</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-rule-bola"><label class="form-check-label"
                                        for="opt-rule-bola">BolaRule</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-rule-insufficient-buffer"><label class="form-check-label"
                                        for="opt-rule-insufficient-buffer">InsufficientBufferRule</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-rule-switch-history"><label class="form-check-label"
                                        for="opt-rule-switch-history">SwitchHistoryRule</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-rule-dropped-frames"><label class="form-check-label"
                                        for="opt-rule-dropped-frames">DroppedFramesRule</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-rule-abandon"><label class="form-check-label"
                                        for="opt-rule-abandon">AbandonRequestsRule</label></div>
                                <div class="option-section">Low Latency</div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-rule-l2a"><label class="form-check-label"
                                        for="opt-rule-l2a">L2ARule</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-rule-lolp"><label class="form-check-label"
                                        for="opt-rule-lolp">LoLPRule</label></div>
                            </div>
                        </div>

                        <div class="option-card">
                            <div class="option-card-header">Live Delay</div>
                            <div class="option-card-body">
                                <span class="option-label">Initial Live Delay (s)</span><input type="number"
                                    id="opt-live-delay" step="0.1" min="0" placeholder="Auto">
                                <span class="option-label">LiveDelay Fragment Count</span><input type="number"
                                    id="opt-live-delay-frag-count" min="0" placeholder="Auto">
                                <div class="form-check mt-2"><input class="form-check-input" type="checkbox"
                                        id="opt-apply-service-desc"><label class="form-check-label"
                                        for="opt-apply-service-desc">Apply ServiceDescription</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-use-suggested-pd"><label class="form-check-label"
                                        for="opt-use-suggested-pd">Use SuggestedPresentationDelay</label></div>
                                <span class="option-label mt-2">UTC Sync Offset (ms)</span><input type="number"
                                    id="opt-utc-offset" value="0">
                            </div>
                        </div>

                        <div class="option-card">
                            <div class="option-card-header">Live Catchup</div>
                            <div class="option-card-body">
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-catchup-enabled"><label class="form-check-label"
                                        for="opt-catchup-enabled">Live Catchup</label></div>
                                <span class="option-label">Catchup Mode</span>
                                <select id="opt-catchup-mode">
                                    <option value="liveCatchupModeDefault">Default</option>
                                    <option value="liveCatchupModeLoLP">LoL+ Based</option>
                                    <option value="liveCatchupModeStep">Step Based</option>
                                </select>
                                <span class="option-label mt-2">Max Drift (s)</span><input type="number"
                                    id="opt-catchup-max-drift" step="0.1" min="0" placeholder="Auto">
                                <span class="option-label">Live Threshold</span><input type="number"
                                    id="opt-catchup-live-threshold" step="0.1" min="-1" placeholder="Auto">
                                <span class="option-label mt-2">Step Start Min</span><input type="number"
                                    id="opt-catchup-step-start-min" step="0.1" min="0" placeholder="Auto">
                                <span class="option-label">Step Start Max</span><input type="number"
                                    id="opt-catchup-step-start-max" step="0.1" min="0" placeholder="Auto">
                                <span class="option-label">Step Stop Min</span><input type="number"
                                    id="opt-catchup-step-stop-min" step="0.1" min="0" placeholder="Auto">
                                <span class="option-label">Step Stop Max</span><input type="number"
                                    id="opt-catchup-step-stop-max" step="0.1" min="0" placeholder="Auto">
                            </div>
                        </div>

                        <div class="option-card">
                            <div class="option-card-header">Advanced & Diagnostics</div>
                            <div class="option-card-body">
                                <span class="option-label">Stall Threshold (s)</span><input type="number"
                                    id="opt-stall-threshold" step="0.1" value="0.5" min="0">
                                <span class="option-label">Log Level</span>
                                <select id="opt-log-level">
                                    <option value="0">NONE</option>
                                    <option value="1">FATAL</option>
                                    <option value="2">ERROR</option>
                                    <option value="3" selected>WARNING</option>
                                    <option value="4">INFO</option>
                                    <option value="5">DEBUG</option>
                                </select>
                                <div class="form-check mt-2"><input class="form-check-input" type="checkbox"
                                        id="opt-cmcd-enabled"><label class="form-check-label"
                                        for="opt-cmcd-enabled">Enable CMCD</label></div>
                                <div class="form-check"><input class="form-check-input" type="checkbox"
                                        id="opt-cmsd-enabled"><label class="form-check-label"
                                        for="opt-cmsd-enabled">Enable CMSD</label></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="video-wrapper mb-3 position-relative">
                <video class="video-element w-100 rounded" controls disableRemotePlayback="true"
                    style="background: black;"></video>
            </div>

            <div class="notification-panel mt-3 border rounded p-2 bg-body-tertiary">
                <div class="notification-header">
                    <div class="notification-header-row d-flex justify-content-between align-items-center mb-2">
                        <h6 class="mb-0 text-secondary">
                            <i class="bi bi-bell"></i> Notifications
                            <span class="badge bg-secondary ms-1 notification-count" id="notification-count">0</span>
                        </h6>
                        <button class="btn btn-sm btn-outline-secondary btn-notification-clear"
                            id="btn-notification-clear">
                            <i class="bi bi-trash"></i> Clear
                        </button>
                    </div>
                    <div class="notification-header-row d-flex gap-2 mb-2">
                        <div class="notification-filters d-flex gap-1">
                            <button class="btn btn-sm btn-outline-danger notification-filter-btn active"
                                data-filter="error">Error</button>
                            <button class="btn btn-sm btn-outline-warning notification-filter-btn active"
                                data-filter="warning">Warning</button>
                            <button class="btn btn-sm btn-outline-info notification-filter-btn active"
                                data-filter="suggestion">Suggestion</button>
                        </div>
                        <input type="text" class="form-control form-control-sm notification-search"
                            id="notification-search" placeholder="Search...">
                    </div>
                </div>
                <div class="notification-list" id="notification-list" style="max-height: 150px; overflow-y: auto;">
                </div>
            </div>

            <div class="stats-panel mt-3">
                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab"
                            data-bs-target=".stats-video" type="button" role="tab">Video</button></li>
                    <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab"
                            data-bs-target=".stats-audio" type="button" role="tab">Audio</button></li>
                    <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab"
                            data-bs-target=".stats-stream" type="button" role="tab">Stream</button></li>
                </ul>
                <div class="tab-content border border-top-0 p-2">

                    <div class="tab-pane fade show active stats-video" role="tabpanel">
                        <div class="metric-row"><span class="metric-label">Buffer Level</span><span
                                class="metric-value ms-auto" id="mv-buffer">0.00 s</span><button
                                class="btn btn-sm btn-link metric-chart-toggle ms-2 p-0" data-metric="buffer"
                                data-type="video"><i class="bi bi-graph-up"></i></button></div>
                        <div class="metric-row"><span class="metric-label">Bitrate</span><span
                                class="metric-value ms-auto" id="mv-bitrate">0 kbps</span><button
                                class="btn btn-sm btn-link metric-chart-toggle ms-2 p-0" data-metric="bitrate"
                                data-type="video"><i class="bi bi-graph-up"></i></button></div>
                        <div class="metric-row"><span class="metric-label">Avg Throughput</span><span
                                class="metric-value ms-auto" id="mv-throughput">0 kbit/s</span><button
                                class="btn btn-sm btn-link metric-chart-toggle ms-2 p-0" data-metric="throughput"
                                data-type="video"><i class="bi bi-graph-up"></i></button></div>
                        <div class="metric-row"><span class="metric-label">Dropped Frames</span><span
                                class="metric-value ms-auto" id="mv-dropped">0</span><button
                                class="btn btn-sm btn-link metric-chart-toggle ms-2 p-0" data-metric="droppedFrames"
                                data-type="video"><i class="bi bi-graph-up"></i></button></div>
                        <div class="metric-row"><span class="metric-label">Resolution</span><span
                                class="metric-value ms-auto" id="mv-resolution">-</span></div>
                        <div class="metric-row"><span class="metric-label">Framerate</span><span
                                class="metric-value ms-auto" id="mv-framerate">-</span></div>
                        <div class="metric-row"><span class="metric-label">Codec</span><span
                                class="metric-value ms-auto" id="mv-codec">-</span></div>

                        <div class="metric-section-title mt-2 fw-bold d-none" id="mv-live-section">Live Metrics</div>
                        <div class="metric-row d-none" id="mv-live-latency-row"><span class="metric-label">Live
                                Latency</span><span class="metric-value ms-auto" id="mv-live-latency">-</span><button
                                class="btn btn-sm btn-link metric-chart-toggle ms-2 p-0" data-metric="liveLatency"
                                data-type="video"><i class="bi bi-graph-up"></i></button></div>
                    </div>

                    <div class="tab-pane fade stats-audio" role="tabpanel">
                        <div class="metric-row"><span class="metric-label">Buffer Level</span><span
                                class="metric-value ms-auto" id="ma-buffer">0.00 s</span><button
                                class="btn btn-sm btn-link metric-chart-toggle ms-2 p-0" data-metric="buffer"
                                data-type="audio"><i class="bi bi-graph-up"></i></button></div>
                        <div class="metric-row"><span class="metric-label">Bitrate</span><span
                                class="metric-value ms-auto" id="ma-bitrate">0 kbps</span><button
                                class="btn btn-sm btn-link metric-chart-toggle ms-2 p-0" data-metric="bitrate"
                                data-type="audio"><i class="bi bi-graph-up"></i></button></div>
                        <div class="metric-row"><span class="metric-label">Codec</span><span
                                class="metric-value ms-auto" id="ma-codec">-</span></div>
                    </div>

                    <div class="tab-pane fade stats-stream" role="tabpanel">
                        <div class="metric-row"><span class="metric-label">Active Period</span><span
                                class="metric-value ms-auto" id="ms-active-period">-</span></div>
                        <div class="metric-row"><span class="metric-label">Type</span><span class="metric-value ms-auto"
                                id="ms-mpd-type">-</span></div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('shown.bs.tab', function (event) {
            // Find the container for the clicked tab
            const container = event.target.closest('.player-instance');
            if (container) {
                // Get target class from data-bs-target (e.g. '.stats-video')
                const targetSelector = event.target.getAttribute('data-bs-target');
                if (targetSelector) {
                    // Hide all tab panes in this specific container
                    container.querySelectorAll('.tab-pane').forEach(pane => {
                        pane.classList.remove('show', 'active');
                    });
                    // Show the targeted one in this specific container
                    const targetPane = container.querySelector(targetSelector);
                    if (targetPane) {
                        targetPane.classList.add('show', 'active');
                    }
                }
            }
        });
    </script>

    <script type="module" src="app/js/main.js"></script>
</body>

</html>
